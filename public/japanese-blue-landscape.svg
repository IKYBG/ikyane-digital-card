<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Paysage japonais minimaliste bleu nuit</title>
  <desc id="desc">Mont Fuji, lune, brume, eau et torii dans une palette bleu blanc futuriste.</desc>
  <defs>
